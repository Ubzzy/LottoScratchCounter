<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch Ticket Counter</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            @page {
                margin: 0.5in;
            }
            body { 
                margin: 0; 
                padding: 0; 
            }
            .no-print { display: none !important; }
            .print-date { display: block !important; }
            .bg-gradient-to-br { background: white !important; }
            .shadow-xl { box-shadow: none !important; }
            .rounded-2xl { border-radius: 0 !important; }
            .print-summary { 
                padding: 10px !important; 
                page-break-inside: avoid;
                max-height: 100vh;
            }
            .print-date {
                font-size: 11px !important;
                margin-bottom: 8px !important;
                color: #666 !important;
            }
            .print-summary h2 { 
                font-size: 16px !important; 
                margin-bottom: 8px !important;
                margin-top: 0 !important;
            }
            .summary-grid {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 6px !important;
                margin-bottom: 10px !important;
            }
            .summary-item-print { 
                padding: 6px 10px !important; 
                margin: 0 !important;
                font-size: 11px !important;
                background: #f9fafb !important;
                border: 1px solid #e5e7eb !important;
            }
            .summary-item-print .text-lg { 
                font-size: 12px !important;
            }
            .summary-item-print .text-xl { 
                font-size: 13px !important;
            }
            .summary-item-print .text-sm { 
                font-size: 10px !important;
            }
            .grand-total-print { 
                padding-top: 10px !important; 
                margin-top: 10px !important;
                border-top: 2px solid #000 !important;
            }
            .grand-total-print .text-2xl { 
                font-size: 14px !important;
            }
            .grand-total-print .text-3xl { 
                font-size: 18px !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Lucide React Icons as inline SVG components
        const Plus = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Trash2 = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const Calculator = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="4" y="2" width="16" height="20" rx="2"></rect>
                <line x1="8" y1="6" x2="16" y2="6"></line>
                <line x1="16" y1="14" x2="16" y2="18"></line>
                <path d="M16 10h.01"></path>
                <path d="M12 10h.01"></path>
                <path d="M8 10h.01"></path>
                <path d="M12 14h.01"></path>
                <path d="M8 14h.01"></path>
                <path d="M12 18h.01"></path>
                <path d="M8 18h.01"></path>
            </svg>
        );

        const Printer = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
        );

        function LotteryCounter() {
            const [bundles, setBundles] = useState([]);
            const [looseTickets, setLooseTickets] = useState([]);
            const [ticketValue, setTicketValue] = useState('1');
            const [firstNumber, setFirstNumber] = useState('');
            const [lastNumber, setLastNumber] = useState('');
            const [looseTicketValue, setLooseTicketValue] = useState('1');
            const [looseTicketCount, setLooseTicketCount] = useState('');
            const [looseTicketNumbers, setLooseTicketNumbers] = useState('');

            const calculateTickets = (first, last) => {
                const firstNum = parseInt(first.slice(-3)) || 0;
                const lastNum = parseInt(last.slice(-3)) || 0;
                return Math.abs(lastNum - firstNum) + 1;
            };

            const addBundle = () => {
                if (firstNumber && lastNumber) {
                    const count = calculateTickets(firstNumber, lastNumber);
                    setBundles([...bundles, {
                        id: Date.now(),
                        value: parseFloat(ticketValue),
                        first: firstNumber,
                        last: lastNumber,
                        count: count,
                        total: count * parseFloat(ticketValue)
                    }]);
                    setFirstNumber('');
                    setLastNumber('');
                }
            };

            const removeBundle = (id) => {
                setBundles(bundles.filter(b => b.id !== id));
            };

            const addLooseTickets = () => {
                if (looseTicketCount && parseInt(looseTicketCount) > 0) {
                    setLooseTickets([...looseTickets, {
                        id: Date.now(),
                        value: parseFloat(looseTicketValue),
                        count: parseInt(looseTicketCount),
                        numbers: looseTicketNumbers,
                        total: parseInt(looseTicketCount) * parseFloat(looseTicketValue)
                    }]);
                    setLooseTicketCount('');
                    setLooseTicketNumbers('');
                }
            };

            const removeLooseTicket = (id) => {
                setLooseTickets(looseTickets.filter(t => t.id !== id));
            };

            const clearAll = () => {
                setBundles([]);
                setLooseTickets([]);
            };

            const groupedBundles = bundles.reduce((acc, bundle) => {
                if (!acc[bundle.value]) {
                    acc[bundle.value] = [];
                }
                acc[bundle.value].push(bundle);
                return acc;
            }, {});

            const groupedLoose = looseTickets.reduce((acc, ticket) => {
                if (!acc[ticket.value]) {
                    acc[ticket.value] = { count: 0, total: 0 };
                }
                acc[ticket.value].count += ticket.count;
                acc[ticket.value].total += ticket.total;
                return acc;
            }, {});

            const totalsByValue = Object.entries(groupedBundles).map(([value, items]) => ({
                value: parseFloat(value),
                count: items.reduce((sum, item) => sum + item.count, 0),
                total: items.reduce((sum, item) => sum + item.total, 0)
            }));

            // Add loose tickets to totals
            Object.entries(groupedLoose).forEach(([value, data]) => {
                const existing = totalsByValue.find(item => item.value === parseFloat(value));
                if (existing) {
                    existing.count += data.count;
                    existing.total += data.total;
                } else {
                    totalsByValue.push({
                        value: parseFloat(value),
                        count: data.count,
                        total: data.total
                    });
                }
            });

            totalsByValue.sort((a, b) => a.value - b.value);

            const grandTotal = totalsByValue.reduce((sum, item) => sum + item.total, 0);

            const getCurrentDate = () => {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                return new Date().toLocaleDateString('en-US', options);
            };

            const handlePrint = () => {
                window.print();
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    if (!firstNumber) {
                        document.getElementById('firstNumber').focus();
                    } else if (!lastNumber) {
                        document.getElementById('lastNumber').focus();
                    } else {
                        addBundle();
                        document.getElementById('firstNumber').focus();
                    }
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-white rounded-2xl shadow-xl p-6 mb-6">
                            <h1 className="text-3xl font-bold text-gray-800 mb-6 flex items-center gap-2 no-print">
                                <Calculator className="text-indigo-600" />
                                Scratch Ticket Counter
                            </h1>

                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4 no-print">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Ticket Value ($)
                                    </label>
                                    <select
                                        value={ticketValue}
                                        onChange={(e) => setTicketValue(e.target.value)}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                    >
                                        <option value="1">$1</option>
                                        <option value="2">$2</option>
                                        <option value="3">$3</option>
                                        <option value="4">$4</option>
                                        <option value="5">$5</option>
                                        <option value="10">$10</option>
                                        <option value="20">$20</option>
                                        <option value="25">$25</option>
                                        <option value="30">$30</option>
                                        <option value="50">$50</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        First Ticket #
                                    </label>
                                    <input
                                        id="firstNumber"
                                        type="text"
                                        value={firstNumber}
                                        onChange={(e) => setFirstNumber(e.target.value)}
                                        onKeyPress={handleKeyPress}
                                        placeholder="e.g., 001"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Last Ticket #
                                    </label>
                                    <input
                                        id="lastNumber"
                                        type="text"
                                        value={lastNumber}
                                        onChange={(e) => setLastNumber(e.target.value)}
                                        onKeyPress={handleKeyPress}
                                        placeholder="e.g., 050"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                    />
                                </div>

                                <div className="flex items-end">
                                    <button
                                        onClick={addBundle}
                                        className="w-full px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition flex items-center justify-center gap-2 font-medium"
                                    >
                                        <Plus size={20} />
                                        Add Bundle
                                    </button>
                                </div>
                            </div>

                            {firstNumber && lastNumber && (
                                <div className="text-sm text-gray-600 mb-4 p-3 bg-blue-50 rounded-lg no-print">
                                    Preview: {calculateTickets(firstNumber, lastNumber)} tickets × ${ticketValue} = 
                                    <span className="font-bold text-indigo-600 ml-1">
                                        ${(calculateTickets(firstNumber, lastNumber) * parseFloat(ticketValue)).toFixed(2)}
                                    </span>
                                </div>
                            )}
                        </div>

                        <div className="bg-white rounded-2xl shadow-xl p-6 mb-6 no-print">
                            <h2 className="text-xl font-bold text-gray-800 mb-4">Add Loose Tickets</h2>
                            <p className="text-sm text-gray-600 mb-4">For tickets that aren't in bundles (e.g., crosswords wrapped with ribbon)</p>
                            
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Ticket Value ($)
                                    </label>
                                    <select
                                        value={looseTicketValue}
                                        onChange={(e) => setLooseTicketValue(e.target.value)}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                    >
                                        <option value="1">$1</option>
                                        <option value="2">$2</option>
                                        <option value="3">$3</option>
                                        <option value="4">$4</option>
                                        <option value="5">$5</option>
                                        <option value="10">$10</option>
                                        <option value="20">$20</option>
                                        <option value="25">$25</option>
                                        <option value="30">$30</option>
                                        <option value="50">$50</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Number of Tickets
                                    </label>
                                    <input
                                        type="number"
                                        value={looseTicketCount}
                                        onChange={(e) => setLooseTicketCount(e.target.value)}
                                        placeholder="e.g., 10"
                                        min="1"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Ticket Numbers (Optional)
                                    </label>
                                    <input
                                        type="text"
                                        value={looseTicketNumbers}
                                        onChange={(e) => setLooseTicketNumbers(e.target.value)}
                                        placeholder="e.g., 001, 005, 012"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                    />
                                </div>

                                <div className="flex items-end">
                                    <button
                                        onClick={addLooseTickets}
                                        className="w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition flex items-center justify-center gap-2 font-medium"
                                    >
                                        <Plus size={20} />
                                        Add Loose
                                    </button>
                                </div>
                            </div>

                            {looseTicketCount && parseInt(looseTicketCount) > 0 && (
                                <div className="text-sm text-gray-600 mt-4 p-3 bg-green-50 rounded-lg">
                                    Preview: {looseTicketCount} loose tickets × ${looseTicketValue} = 
                                    <span className="font-bold text-green-600 ml-1">
                                        ${(parseInt(looseTicketCount) * parseFloat(looseTicketValue)).toFixed(2)}
                                    </span>
                                </div>
                            )}
                        </div>

                        {totalsByValue.length > 0 && (
                            <div className="bg-white rounded-2xl shadow-xl p-6 mb-6 print-summary">
                                <div className="print-date no-print" style={{display: 'none'}}></div>
                                <div style={{display: 'none'}} className="print-date">{getCurrentDate()}</div>
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-2xl font-bold text-gray-800">Summary</h2>
                                    <div className="flex gap-2 no-print">
                                        <button
                                            onClick={handlePrint}
                                            className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition text-sm flex items-center gap-2"
                                        >
                                            <Printer size={18} />
                                            Print
                                        </button>
                                        <button
                                            onClick={clearAll}
                                            className="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition text-sm"
                                        >
                                            Clear All
                                        </button>
                                    </div>
                                </div>

                                <div className="summary-grid">
                                    {totalsByValue.map((item) => (
                                        <div key={item.value} className="bg-gradient-to-r from-indigo-50 to-blue-50 p-4 rounded-lg summary-item-print">
                                            <div className="flex justify-between items-center">
                                                <span className="text-lg font-semibold text-gray-700">
                                                    ${item.value.toFixed(2)} tickets
                                                </span>
                                                <div className="text-right">
                                                    <div className="text-sm text-gray-600">{item.count} tickets</div>
                                                    <div className="text-xl font-bold text-indigo-600">
                                                        ${item.total.toFixed(2)}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="border-t-2 border-gray-300 pt-4 grand-total-print">
                                    <div className="flex justify-between items-center">
                                        <span className="text-2xl font-bold text-gray-800">Grand Total</span>
                                        <span className="text-3xl font-bold text-green-600">
                                            ${grandTotal.toFixed(2)}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {bundles.length > 0 && (
                            <div className="bg-white rounded-2xl shadow-xl p-6 mb-6 no-print">
                                <h2 className="text-xl font-bold text-gray-800 mb-4">All Bundles</h2>
                                <div className="space-y-2">
                                    {bundles.map((bundle) => (
                                        <div key={bundle.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                                            <div className="flex items-center gap-4">
                                                <span className="font-semibold text-indigo-600">${bundle.value}</span>
                                                <span className="text-sm text-gray-600">
                                                    #{bundle.first} → #{bundle.last}
                                                </span>
                                                <span className="text-sm font-medium text-gray-700">
                                                    {bundle.count} tickets = ${bundle.total.toFixed(2)}
                                                </span>
                                            </div>
                                            <button
                                                onClick={() => removeBundle(bundle.id)}
                                                className="text-red-500 hover:text-red-700 transition"
                                            >
                                                <Trash2 size={18} />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {looseTickets.length > 0 && (
                            <div className="bg-white rounded-2xl shadow-xl p-6 mb-6 no-print">
                                <h2 className="text-xl font-bold text-gray-800 mb-4">Loose Tickets</h2>
                                <div className="space-y-2">
                                    {looseTickets.map((ticket) => (
                                        <div key={ticket.id} className="flex justify-between items-center p-3 bg-green-50 rounded-lg hover:bg-green-100 transition">
                                            <div className="flex items-center gap-4">
                                                <span className="font-semibold text-green-600">${ticket.value}</span>
                                                <span className="text-sm text-gray-600">
                                                    {ticket.count} loose tickets
                                                </span>
                                                {ticket.numbers && (
                                                    <span className="text-sm text-gray-500">
                                                        ({ticket.numbers})
                                                    </span>
                                                )}
                                                <span className="text-sm font-medium text-gray-700">
                                                    = ${ticket.total.toFixed(2)}
                                                </span>
                                            </div>
                                            <button
                                                onClick={() => removeLooseTicket(ticket.id)}
                                                className="text-red-500 hover:text-red-700 transition"
                                            >
                                                <Trash2 size={18} />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                    
                    <div className="text-center text-gray-500 text-sm py-6 no-print">
                        Created by Ubaid
                    </div>
                </div>
            );
        }

        ReactDOM.render(<LotteryCounter />, document.getElementById('root'));
    </script>
</body>
</html>
